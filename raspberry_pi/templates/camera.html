<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HSBR Camera</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #video {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        #status {
            position: fixed;
            top: 8px;
            left: 8px;

            padding: 5px 10px;

            background: rgba(0, 0, 0, 0.6);
            border-radius: 5px;

            font-size: 14px;
        }
    </style>
</head>

<body>

    <div id="status">Camera starting...</div>

    <img id="video"
         src="/video_feed"
         alt="HSBR Camera">

    <script>
        function updateStatus() {
            fetch("/api/camera/status")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("status").textContent =
                        data.width + "x" +
                        data.height + "  " +
                        data.actual_fps + " fps";
                })
                .catch(() => {
                    document.getElementById("status").textContent =
                        "Camera status unavailable";
                });
        }

        setInterval(updateStatus, 2000);
        updateStatus();
    </script>

</body>
</html>
